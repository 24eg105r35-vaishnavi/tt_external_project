services:
  db:
    image: mysql:8.0
    container_name: achievement_portal_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-achievement_portal}
      MYSQL_USER: ${DB_USER:-portal_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-portal_pass123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: achievement_portal_app
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-achievement_portal}
      DB_USER: ${DB_USER:-portal_user}
      DB_PASSWORD: ${DB_PASSWORD:-portal_pass123}
      UPLOAD_DIR: /app/uploads
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-admin123}
      FACULTY_DEFAULT_PASSWORD: ${FACULTY_DEFAULT_PASSWORD:-faculty123}
    volumes:
      - app_uploads:/app/uploads

volumes:
  mysql_data:
  app_uploads:
