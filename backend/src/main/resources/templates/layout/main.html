<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Student Achievement Portal</title>
    <!-- Dynamic meta description -->
    <meta th:if="${metaDescription != null}" name="description" th:content="${metaDescription}">
    <!-- Robots: noindex by default on private, college-only, and internal pages -->
    <meta th:if="${metaRobots != null}" name="robots" th:content="${metaRobots}">
    <meta th:if="${metaRobots == null}" name="robots" content="noindex">
    <!-- Canonical link -->
    <link th:if="${canonicalUrl != null}" rel="canonical" th:href="${canonicalUrl}">
    <!-- Open Graph tags for rich previews -->
    <meta th:if="${ogTitle != null}" property="og:title" th:content="${ogTitle}">
    <meta th:if="${ogDescription != null}" property="og:description" th:content="${ogDescription}">
    <meta th:if="${ogType != null}" property="og:type" th:content="${ogType}">
    <meta th:if="${canonicalUrl != null}" property="og:url" th:content="${canonicalUrl}">
    <!-- JSON-LD structured data -->
    <script th:if="${jsonLd != null}" type="application/ld+json" th:utext="${jsonLd}"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Page Content -->
    <main class="main-content">
        <th:block th:replace="${content}" />
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
