<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout(~{::title}, ~{::section})}">
<head>
    <title>Profile Not Available - Student Achievement Portal</title>
</head>
<body>
    <section class="container" style="max-width: 540px; margin: 4rem auto; text-align: center;">
        <div class="auth-card" style="padding: 3rem 2rem;">
            <div style="font-size: 3.5rem; margin-bottom: 1rem;">&#128274;</div>
            <h1 style="font-size: 1.75rem; color: var(--primary-dark); margin-bottom: 0.75rem;">
                Profile Not Found or Private
            </h1>
            <p style="color: var(--muted-color); font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem;">
                This student profile does not exist, is set to private, or requires a college member login to view.
            </p>

            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn-primary" style="text-decoration: none; padding: 0.75rem;">
                    Sign in with College Account
                </a>
                <a th:href="@{/}" class="btn-logout" style="text-decoration: none; padding: 0.75rem;">
                    &larr; Return to Home Page
                </a>
            </div>
        </div>
    </section>
</body>
</html>
