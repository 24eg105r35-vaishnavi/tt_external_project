<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout(~{::title}, ~{::section})}">
<head>
    <title>500 - Server Error</title>
</head>
<body>
    <section class="container" style="text-align: center; padding: 4rem 1.5rem;">
        <div class="card" style="max-width: 550px; margin: 0 auto; padding: 3rem 2rem;">
            <div style="font-size: 3.5rem; margin-bottom: 1rem;">&#9888;&#65039;</div>
            <h1 style="font-size: 2rem; color: #b45309; margin-bottom: 0.5rem;">500 - Something Went Wrong</h1>
            <p style="color: var(--muted-color); font-size: 1rem; line-height: 1.6; margin-bottom: 2rem;">
                An unexpected server error occurred while processing your request. Please try again later or return to your dashboard.
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a th:href="@{/}" class="btn-primary" style="padding: 0.6rem 1.5rem; text-decoration: none;">Return Home</a>
                <a sec:authorize="hasRole('STUDENT')" th:href="@{/student/dashboard}" class="btn-secondary" style="padding: 0.6rem 1.5rem; text-decoration: none;">My Dashboard</a>
                <a sec:authorize="hasRole('FACULTY')" th:href="@{/faculty/dashboard}" class="btn-secondary" style="padding: 0.6rem 1.5rem; text-decoration: none;">Faculty Dashboard</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="btn-secondary" style="padding: 0.6rem 1.5rem; text-decoration: none;">Admin Console</a>
            </div>
        </div>
    </section>
</body>
</html>
