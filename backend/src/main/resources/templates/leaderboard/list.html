<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::section})}">
<head>
    <title>Student Leaderboard - Student Achievement Portal</title>
</head>
<body>
    <section class="container" style="padding-top: 1.5rem; padding-bottom: 3rem;">
        <div class="dashboard-header" style="margin-bottom: 2rem;">
            <div>
                <h1 style="font-size: 1.85rem; color: var(--primary-dark); margin-bottom: 0.25rem;">&#127942; Student Leaderboard</h1>
                <p style="color: var(--muted-color); font-size: 0.95rem; margin: 0;">
                    Top 10 performing students ranked by total verified achievement points.
                </p>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="card" style="margin-bottom: 2rem; padding: 1.25rem;">
            <form th:action="@{/leaderboard}" method="get" style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 180px;">
                    <label for="branch" style="font-size: 0.85rem; font-weight: 600; color: var(--slate-700, #334155); display: block; margin-bottom: 0.35rem;">Filter by Branch</label>
                    <select id="branch" name="branch" class="form-control" style="padding: 0.45rem 0.75rem;">
                        <option value="">All Branches</option>
                        <option th:each="b : ${branches}" th:value="${b}" th:text="${b}" th:selected="${b == selectedBranch}"></option>
                    </select>
                </div>
                <div style="flex: 1; min-width: 150px;">
                    <label for="year" style="font-size: 0.85rem; font-weight: 600; color: var(--slate-700, #334155); display: block; margin-bottom: 0.35rem;">Filter by Year</label>
                    <select id="year" name="year" class="form-control" style="padding: 0.45rem 0.75rem;">
                        <option value="">All Years</option>
                        <option th:each="y : ${years}" th:value="${y}" th:text="'Year ' + ${y}" th:selected="${y == selectedYear}"></option>
                    </select>
                </div>
                <div style="display: flex; gap: 0.5rem;">
                    <button type="submit" class="btn-primary" style="padding: 0.55rem 1.25rem; font-size: 0.9rem;">Apply</button>
                    <a th:href="@{/leaderboard}" class="btn-secondary" style="padding: 0.55rem 1rem; font-size: 0.9rem; text-decoration: none; display: inline-flex; align-items: center;">Reset</a>
                </div>
            </form>
        </div>

        <!-- Top 10 Table -->
        <div class="card" style="padding: 0; overflow: hidden;">
            <div th:if="${#lists.isEmpty(leaderboard)}" style="text-align: center; padding: 3rem 1.5rem; color: var(--muted-color);">
                <h3>No achievements found</h3>
                <p>There are no verified student achievements matching the selected criteria.</p>
            </div>

            <div th:unless="${#lists.isEmpty(leaderboard)}" style="overflow-x: auto;">
                <table class="table" style="width: 100%; margin: 0; border-collapse: collapse;">
                    <thead>
                        <tr style="background: var(--slate-50, #f8fafc); border-bottom: 1px solid var(--border-color); text-align: left;">
                            <th style="padding: 0.85rem 1.25rem; font-size: 0.85rem; color: var(--slate-600, #475569); width: 80px;">Rank</th>
                            <th style="padding: 0.85rem 1.25rem; font-size: 0.85rem; color: var(--slate-600, #475569);">Student Name</th>
                            <th style="padding: 0.85rem 1.25rem; font-size: 0.85rem; color: var(--slate-600, #475569); width: 120px;">Branch</th>
                            <th style="padding: 0.85rem 1.25rem; font-size: 0.85rem; color: var(--slate-600, #475569); width: 100px;">Year</th>
                            <th style="padding: 0.85rem 1.25rem; font-size: 0.85rem; color: var(--slate-600, #475569); width: 130px; text-align: right;">Points</th>
                            <th style="padding: 0.85rem 1.25rem; font-size: 0.85rem; color: var(--slate-600, #475569); width: 140px; text-align: right;">Achievements</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="row : ${leaderboard}" style="border-bottom: 1px solid var(--border-color); transition: background-color 0.15s ease;">
                            <td style="padding: 0.85rem 1.25rem; font-weight: 700;">
                                <span th:if="${row.rank == 1}" style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; background: #fef3c7; color: #b45309; border-radius: 50%; font-size: 0.95rem;">&#129351;</span>
                                <span th:if="${row.rank == 2}" style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; background: #e2e8f0; color: #475569; border-radius: 50%; font-size: 0.95rem;">&#129352;</span>
                                <span th:if="${row.rank == 3}" style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; background: #fed7aa; color: #9a3412; border-radius: 50%; font-size: 0.95rem;">&#129353;</span>
                                <span th:if="${row.rank > 3}" style="color: var(--muted-color); font-weight: 600; padding-left: 0.5rem;" th:text="${row.rank}">4</span>
                            </td>
                            <td style="padding: 0.85rem 1.25rem; font-weight: 600; color: var(--slate-800, #1e293b);" th:text="${row.fullName}">
                                Student Name
                            </td>
                            <td style="padding: 0.85rem 1.25rem;">
                                <span class="badge" style="font-size: 0.8rem; margin: 0;" th:text="${row.branch}">CSE</span>
                            </td>
                            <td style="padding: 0.85rem 1.25rem; color: var(--slate-600, #475569);" th:text="'Year ' + ${row.year}">
                                Year 3
                            </td>
                            <td style="padding: 0.85rem 1.25rem; text-align: right; font-weight: 700; color: var(--success-color);" th:text="${row.totalPoints} + ' pts'">
                                48 pts
                            </td>
                            <td style="padding: 0.85rem 1.25rem; text-align: right; color: var(--slate-700, #334155);" th:text="${row.achievementCount}">
                                4
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</body>
</html>
