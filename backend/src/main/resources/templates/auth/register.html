<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::section})}">
<head>
    <title>Student Registration - Student Achievement Portal</title>
</head>
<body>
    <section class="container auth-wrapper">
        <div class="auth-card">
            <h2>Student Registration</h2>
            <p class="subtitle">Create your portal profile using your official college email</p>

            <!-- Global Error Alert -->
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
                An error occurred during registration.
            </div>

            <form th:action="@{/register}" th:object="${registerDto}" method="post">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="e.g. Rahul Sharma">
                    <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                </div>

                <div class="form-group">
                    <label for="email">College Email (@anurag.edu.in)</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="rollno@anurag.edu.in">
                    <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password (min 8 chars)</label>
                        <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="••••••••">
                        <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="••••••••">
                        <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="rollNumber">Roll Number</label>
                        <input type="text" id="rollNumber" th:field="*{rollNumber}" class="form-control" placeholder="e.g. 21EG105A01">
                        <span class="field-error" th:if="${#fields.hasErrors('rollNumber')}" th:errors="*{rollNumber}"></span>
                    </div>

                    <div class="form-group">
                        <label for="branch">Branch</label>
                        <input type="text" id="branch" th:field="*{branch}" class="form-control" placeholder="e.g. CSE, ECE">
                        <span class="field-error" th:if="${#fields.hasErrors('branch')}" th:errors="*{branch}"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="year">Academic Year</label>
                        <select id="year" th:field="*{year}" class="form-control">
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                        <span class="field-error" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></span>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" th:field="*{phone}" class="form-control" placeholder="9876543210">
                        <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 0.5rem;">Register Account</button>
            </form>

            <div class="auth-footer">
                Already registered? <a th:href="@{/login}">Sign in here</a>
            </div>
        </div>
    </section>
</body>
</html>
