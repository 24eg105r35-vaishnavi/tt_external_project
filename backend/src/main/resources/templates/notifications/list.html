<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::section})}">
<head>
    <title>Notifications - Student Achievement Portal</title>
</head>
<body>
    <section class="container" style="max-width: 800px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
            <div>
                <span class="badge">Activity</span>
                <h1 style="margin: 0.25rem 0 0;">Notifications</h1>
            </div>

            <!-- Mark all as read button -->
            <form th:if="${not #lists.isEmpty(notifications)}" th:action="@{/notifications/read-all}" method="post">
                <button type="submit" class="btn-logout" style="cursor: pointer; padding: 0.5rem 1rem; font-size: 0.85rem;">
                    &#10003; Mark all as read
                </button>
            </form>
        </div>

        <!-- Success or Error Messages -->
        <div th:if="${successMessage}" class="alert alert-success" style="margin-bottom: 1rem;" th:text="${successMessage}">
            Success message
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger" style="margin-bottom: 1rem;" th:text="${errorMessage}">
            Error message
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(notifications)}" class="card" style="text-align: center; padding: 2.5rem; color: var(--muted-color);">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">&#128276;</div>
            <h3>No notifications yet</h3>
            <p>You're all caught up! New updates on your achievement verification will appear here.</p>
        </div>

        <!-- Notification List -->
        <div th:if="${not #lists.isEmpty(notifications)}">
            <div th:each="n : ${notifications}"
                 class="notification-item"
                 th:classappend="${!n.isRead} ? ' notification-unread' : ''">
                <div style="flex: 1; min-width: 240px;">
                    <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem;">
                        <span th:if="${!n.isRead}" style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--primary);"></span>
                        <span th:if="${!n.isRead}" class="status-badge status-pending" style="font-size: 0.7rem; padding: 0.1rem 0.4rem;">New</span>
                        <small style="color: var(--muted-color);" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</small>
                    </div>
                    <p style="margin: 0; color: var(--slate-800, #1e293b); font-size: 0.95rem; line-height: 1.4;" th:text="${n.message}">
                        Notification text goes here.
                    </p>
                </div>

                <!-- Mark as read button for unread notifications -->
                <div th:if="${!n.isRead}">
                    <form th:action="@{/notifications/{id}/read(id=${n.id})}" method="post">
                        <button type="submit" class="btn-logout" style="font-size: 0.8rem; padding: 0.35rem 0.75rem; cursor: pointer;">
                            Mark read
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
