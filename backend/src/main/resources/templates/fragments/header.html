<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <header th:fragment="header" class="site-header">
        <div class="container header-container">
            <a th:href="@{/}" class="logo">&#127891; Student Achievement Portal</a>
            <ul class="nav-links">
                <li><a th:href="@{/}">Home</a></li>

                <!-- Links for Logged Out Users -->
                <li sec:authorize="isAnonymous()">
                    <a th:href="@{/login}">Login</a>
                </li>
                <li sec:authorize="isAnonymous()">
                    <a th:href="@{/register}">Register</a>
                </li>

                <!-- Role Specific Dashboard Links -->
                <li sec:authorize="hasRole('STUDENT')">
                    <a th:href="@{/student/dashboard}">Dashboard</a>
                </li>
                <li sec:authorize="hasRole('STUDENT')">
                    <a th:href="@{/student/achievements}">Achievements</a>
                </li>
                <li sec:authorize="hasRole('STUDENT')">
                    <a th:href="@{/student/achievements/new}">+ Upload</a>
                </li>
                <li sec:authorize="hasRole('STUDENT')">
                    <a th:href="@{/student/profile}">Profile</a>
                </li>
                <li sec:authorize="hasRole('FACULTY')">
                    <a th:href="@{/faculty/dashboard}">Dashboard</a>
                </li>
                <li sec:authorize="hasRole('FACULTY')">
                    <a th:href="@{/faculty/queue}">Queue</a>
                </li>
                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/dashboard}">Dashboard</a>
                </li>
                <li sec:authorize="hasAnyRole('FACULTY', 'ADMIN')">
                    <a th:href="@{/search}">Search</a>
                </li>
                <li sec:authorize="hasAnyRole('FACULTY', 'ADMIN')">
                    <a th:href="@{/analytics}">Analytics</a>
                </li>
                <li sec:authorize="isAuthenticated()">
                    <a th:href="@{/leaderboard}">Leaderboard</a>
                </li>

                <!-- Notifications with unread badge for logged in users -->
                <li sec:authorize="isAuthenticated()">
                    <a th:href="@{/notifications}">
                        Notifications<span th:if="${unreadCount != null and unreadCount > 0}" class="badge-notification" th:text="${unreadCount}">1</span>
                    </a>
                </li>

                <!-- User Name and Logout Form for Logged In Users -->
                <li sec:authorize="isAuthenticated()">
                    <span class="nav-user" sec:authentication="name">User</span>
                </li>
                <li sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" style="display:inline;">
                        <button type="submit" class="btn-logout">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </header>
</body>
</html>
