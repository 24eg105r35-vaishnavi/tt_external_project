server.port=${PORT:8080}

# Database settings (MySQL local / Docker / Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:achievement_portal}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:portal_user}
spring.datasource.password=${DB_PASSWORD:portal_pass123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 10MB file upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory for certificates
app.upload-dir=${UPLOAD_DIR:uploads}

# Allowed email domain for student registrations
app.allowed-domain=${APP_ALLOWED_DOMAIN:@college.edu}

# JWT Configuration (secret must be >= 256 bits, expiry 2 hours default)
app.jwt.secret=${APP_JWT_SECRET:StudentAchievementPortalSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026}
app.jwt.expiry-hours=${APP_JWT_EXPIRY:2}

# Frontend CORS Origin
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
