server.port=8080

# Database settings (MySQL local / Docker)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:achievement_portal}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:portal_user}
spring.datasource.password=${DB_PASSWORD:portal_pass123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Thymeleaf cache for immediate template updates
spring.thymeleaf.cache=false

# 10MB file upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory for certificates (uses ./uploads locally or /app/uploads in Docker)
app.upload-dir=${UPLOAD_DIR:uploads}

# Allowed email domain for student registrations
app.allowed-domain=@anurag.edu.in

# Base URL for public profile links, sitemap, and SEO
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Session timeout and cookie security
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Suppress stack traces and raw error messages from being exposed to end users
server.error.include-stacktrace=never
server.error.include-message=never
